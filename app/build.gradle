plugins {
    id 'com.android.application'
}

android {
    namespace 'br.com.kaiohonorato.centraltv'
    compileSdk 34

    defaultConfig {
        applicationId 'br.com.kaiohonorato.centraltv'
        minSdk 21
        targetSdk 28           // a box roda Android 7 a 9; 28 evita bloqueios de abrir sozinho ao ligar
        versionCode System.getenv('GITHUB_RUN_NUMBER') ? System.getenv('GITHUB_RUN_NUMBER').toInteger() : 1
        versionName "1." + (System.getenv('GITHUB_RUN_NUMBER') ?: '0')
    }

    // A chave de assinatura NUNCA fica no repositório. No GitHub Actions ela vem
    // dos secrets CENTRAL_TV_* (ver .github/workflows/apk.yml); localmente, das
    // mesmas variáveis de ambiente. Sem elas, o APK de release sai sem assinatura.
    def chave = System.getenv('CENTRAL_TV_KEYSTORE_FILE')

    signingConfigs {
        box {
            // Chave fixa: cada versão nova instala por cima da anterior, sem desinstalar
            if (chave) {
                storeFile file(chave)
                storePassword System.getenv('CENTRAL_TV_KEYSTORE_PASSWORD')
                keyAlias System.getenv('CENTRAL_TV_KEY_ALIAS')
                keyPassword System.getenv('CENTRAL_TV_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (chave) {
                signingConfig signingConfigs.box
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
