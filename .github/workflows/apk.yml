name: Gerar APK da Central TV

on:
  push:
    branches: [main]
    paths: ['app/**', 'build.gradle', 'settings.gradle', 'gradle.properties', '.github/workflows/apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'
      - name: Compilar
        run: gradle assembleRelease --no-daemon
      - name: Renomear
        run: cp app/build/outputs/apk/release/app-release.apk CentralTV.apk
      - uses: actions/upload-artifact@v4
        with:
          name: CentralTV
          path: CentralTV.apk
      - name: Publicar versão para baixar
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Central TV ${{ github.run_number }}
          files: CentralTV.apk
          make_latest: true
