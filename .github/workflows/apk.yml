name: Gerar APK da Central TV

on:
  push:
    branches: [main]
    paths: ['app/**', 'build.gradle', 'settings.gradle', 'gradle.properties', '.github/workflows/apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'
      - name: Preparar chave de assinatura (vem dos secrets)
        env:
          KEYSTORE_B64: ${{ secrets.CENTRAL_TV_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Falta o secret CENTRAL_TV_KEYSTORE_BASE64 (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/central-tv.keystore"
          echo "CENTRAL_TV_KEYSTORE_FILE=$RUNNER_TEMP/central-tv.keystore" >> "$GITHUB_ENV"
      - name: Compilar
        env:
          CENTRAL_TV_KEYSTORE_PASSWORD: ${{ secrets.CENTRAL_TV_KEYSTORE_PASSWORD }}
          CENTRAL_TV_KEY_ALIAS: ${{ secrets.CENTRAL_TV_KEY_ALIAS }}
          CENTRAL_TV_KEY_PASSWORD: ${{ secrets.CENTRAL_TV_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon
      - name: Apagar chave do runner
        if: always()
        run: rm -f "$RUNNER_TEMP/central-tv.keystore"
      - name: Renomear
        run: cp app/build/outputs/apk/release/app-release.apk CentralTV.apk
      - uses: actions/upload-artifact@v4
        with:
          name: CentralTV
          path: CentralTV.apk
      - name: Publicar versão para baixar
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Central TV ${{ github.run_number }}
          files: CentralTV.apk
          make_latest: true
